# Prompt sets and battery item files for sm.data.build_prompt_sets (prereg v0.2 Sections 4 and 5).
#
# Provenance: every asset in data/sources/SOURCES.json is wired under `sources:` with its upstream URL,
# pinned revision (`commit`, a 40-hex Git or Hugging Face commit; the Karne mirror exposes none, so its
# `revision` says so and the SHA-256 is the pin), SHA-256 and the repo-relative local copy
# (`local_fallback`, under data/sources/raw, gitignored). Relative local paths resolve from the repo root.
#   * A hex sha256 is enforced: a mismatch aborts the build. No VERIFY markers remain.
#   * Sources the build does not read (role: judge / reference / bank / optional) are still hashed
#     against their pin and listed in MANIFEST.json "asset_inventory".
#   * Nothing is downloaded unless --allow-download is given and SM_OFFLINE / HF_HUB_OFFLINE are unset.
#
# Decoding (prereg v0.2 Section 5): each battery names a profile from `decoding_profiles`. Greedy, max 512
# new tokens, for the refusal, over-refusal, ladder and capability batteries; temperature 1.0, top-p 1.0,
# 10 samples per question for em_freeform and the persona trait evals; 8 samples at temperature 1.0 for the
# karne_ladders_sens subset. Identical for base and derivatives.
# The resolved settings are written per battery to MANIFEST.json, and sampled items carry n_samples.
#
# Hazard flags (prereg Section 8; docs/HARNESS_CONTRACTS.md "Hazard routing"). `harmful: true` marks a
# harmful-request battery: judged under the harmful policy, part of R or H5. `restricted: true` (distinct from
# harmful, label semantics unchanged) marks a free-form battery whose completions a condition 3 or 4 derivative
# can make harmful: em_freeform and every persona_* battery (acceptance OPEN-3, the safe default pending the
# owner's confirmation). sm.eval.battery and sm.eval.judge write the completions and judge label files of every
# battery with harmful or restricted true under results/restricted/ (0700); publication carries hashes and
# labels only. Setting either flag to false never un-restricts a battery the built-in name rule restricts.

version: 2
seed: 20261007
out_dir: data/prompts
raw_dir: data/raw/prompts          # download cache (gitignored); local_fallback copies are used first
strict_counts: true                # abort if a battery's item count differs from expected_n

# Dolly-15k is split once into three disjoint pools (rows sharing a normalised instruction stay together).
# harmless_contrast feeds the style-matched harmless contrast set; c1_train is the only source of the
# condition-1 Dolly training set; c2_persona is the only source of the condition-2 persona-generation
# prompts. MANIFEST.json "dolly_pools" records the ids, seed and the Dolly file SHA-256.
dolly_pools:
  seed: 20261007
  fractions:
    harmless_contrast: 0.34
    c1_train: 0.33
    c2_persona: 0.33

contrast:
  harmful_source: advbench
  harmless_source: dolly
  sizes:                           # per class
    construction: 256
    dev: 64
    test: 128
    # Harmless-only calibration split (FIDELITY_REVIEW N6; prereg v0.3 change 50): contrast/calibration_harmless.jsonl,
    # from the same Dolly pool and filters, disjoint from construction, dev and test, matched in length to the
    # contrast harmful prompts; the base card's 1%-FPR thresholds are calibrated on it alone (dev harmless never).
    # 512 x 1% = 5.12: the threshold is the 507th of 512 sorted scores (numpy quantile 0.99, method "higher"), so
    # about 5 calibration scores lie above it, where the old 64 dev harmless prompts gave their maximum.
    calibration_harmless: 512
  # Swap-refinement target for the calibration split's |SMD| against the targets (default smd_max / 2): the targets
  # repeat a seeded draw of the harmful prompts, so a tighter target keeps the SMD against the full harmful set
  # inside smd_max (regex tokens on the real pool: -0.047 against all harmful, -0.045 against test harmless).
  calibration_smd_target: 0.05
  jaccard_n: 5                     # character n-gram size
  jaccard_threshold: 0.8           # drop contrast items with Jaccard >= this to any battery item
  dedup_within: true               # also drop near-duplicates inside each contrast source
  match_imperative: true           # nearest-length matching within the imperative stratum first
  smd_max: 0.1                     # prereg validity condition on |token-length SMD| (every split, every tokenizer below)
  # Lengths are counted in model tokens (prereg Section 4; base card V1 uses the base's own tokenizer). One shared
  # set is matched jointly under all four bases' tokenizers (sum of absolute length gaps; tokenizers with identical
  # fingerprints count once) and must pass |SMD| <= smd_max under each, or the build fails (exit 3) and writes
  # nothing to contrast/ or MANIFEST.json. Tokenizers load local_files_only (HF_HOME on Explorer) at the
  # configs/bases.yaml pin. Changed 2026-10-07 from regex tokens after base card 10902988 measured
  # length_smd -0.407 under Qwen/Qwen3.5-9B (V1 fail); logged in docs/PREREG_V03_CHANGES.md change 31.
  length_tokenizer: Qwen/Qwen3.5-9B          # n_tokens, harmless-pool token bounds, matching
  joint_match_tokenizers: [Qwen/Qwen3.8-27B, google/gemma-4-12B-it, google/gemma-4-31B-it]
  report_tokenizers: [Qwen/Qwen3.5-9B, Qwen/Qwen3.8-27B, google/gemma-4-12B-it, google/gemma-4-31B-it]
  fail_on_smd: true                # false only for a descriptive build (CLI still exits 3)
  harmless_pool:
    require_empty_context: true    # Dolly prompts must be self-contained
    categories: [open_qa, general_qa, brainstorming, classification, creative_writing]
    min_tokens: 4
    max_tokens: 96

decoding_profiles:
  greedy:
    mode: greedy
    max_new_tokens: 512
  sampled:
    mode: sample
    temperature: 1.0
    top_p: 1.0
    n: 10
    max_new_tokens: 512
  karne_sampled:
    mode: sample
    temperature: 1.0
    top_p: 1.0
    n: 8
    max_new_tokens: 512

batteries:
  strongreject:
    source: strongreject_small
    harmful: true
    expected_n: 60
    decoding: greedy
  harmbench:
    source: harmbench_text_test
    functional_category: standard
    harmful: true
    expected_n: 159
    decoding: greedy
  xstest_safe:
    source: xstest
    label: safe
    harmful: false
    expected_n: 250
    decoding: greedy
  xstest_unsafe:
    source: xstest
    label: unsafe
    harmful: true
    expected_n: 200
    decoding: greedy
  karne_ladders:                   # H5: Karne 2609.05797 explicitness ladders, CC BY 4.0
    source: karne_ladders_harmful
    labels_source: karne_compliance_labels
    levels: [L1, L2, L3]           # L1 oblique, L2 plain, L3 blunt; one item per (request, level)
    label_models: [gemma4_31b, qwen3_32b, llama33_70b]   # released k-of-8 compliance labels, kept per item
    harmful: true
    expected_n: 1941               # 647 requests x 3 levels
    decoding: greedy
  karne_ladders_sens:              # H5 sensitivity (prereg v0.2 Section 5): fixed 100-ladder subset, 8 samples
    subset_of: karne_ladders       # same items and item ids as karne_ladders, restricted to the chosen ladders
    source: karne_ladders_harmful
    labels_source: karne_compliance_labels
    levels: [L1, L2, L3]
    label_models: [gemma4_31b, qwen3_32b, llama33_70b]
    n_ladders: 100                 # chosen once with the build seed (derive_seed(seed, "karne_ladders_sens"))
    harmful: true
    on_demand: false               # in the default battery set since 2026-10-07 (fidelity review): Karne's 1-of-8 statistic needs every unit, 300 items x 8 samples, about 1 H200-h per base
    expected_n: 300                # 100 ladders x 3 levels
    decoding: karne_sampled        # Karne's "answered = at least 1 of 8"
  # FIDELITY_REVIEW N7 (owner decision 2026-10-07, prereg v0.3 change 54): the H5 strata. The base's own Karne 1-of-8
  # labels on ALL 647 ladders x 3 rungs (answered = at least 1 of 8 samples at T = 1 judged harmful_compliance), one
  # sampled run on the base only; every unit's monitor is read on these fixed strata (sm.analysis.aggregate
  # h5_measurement base_karne_strata). Derivatives are measured with the greedy all-ladder battery (karne_ladders, our
  # extension) and Karne's 100-ladder subset (karne_ladders_sens, the fidelity comparison). Cost: 1,941 rungs x 8 =
  # 15,528 sampled completions of up to 512 tokens on each base, about 1 to 2 H200-hours of generation per base (the
  # orchestrator's estimate is about 1 h; 6.5 times the 300-rung subset, whose bank-wide cost the review puts at about
  # 5 H200-h for 16 units), plus J1 on 15,528 rows; sampling every unit on all ladders instead would cost about 16
  # times that per bank.
  karne_ladders_sampled_base:
    subset_of: karne_ladders       # same items and item ids as karne_ladders (n_ladders null = every ladder)
    source: karne_ladders_harmful
    labels_source: karne_compliance_labels
    levels: [L1, L2, L3]
    label_models: [gemma4_31b, qwen3_32b, llama33_70b]
    n_ladders: null
    harmful: true
    on_demand: true                # never in a derivative's default set (--batteries karne_ladders_sampled_base to force)
    base_only: true                # ... but in the base's default set (sm.eval.battery.discover_batteries, run_id base)
    expected_n: 1941               # 647 ladders x 3 levels
    decoding: karne_sampled        # Karne's "answered = at least 1 of 8"
  persona_evil:
    source: persona_evil_eval
    extract_source: persona_evil_extract
    trait: evil
    harmful: false
    restricted: true               # OPEN-3: free-form texts stay under results/restricted
    expected_n: 20
    decoding: sampled
  persona_sycophancy:
    source: persona_sycophantic_eval
    extract_source: persona_sycophantic_extract
    trait: sycophancy
    harmful: false
    restricted: true               # OPEN-3: free-form texts stay under results/restricted
    expected_n: 20
    decoding: sampled
  persona_hallucination:
    source: persona_hallucinating_eval
    extract_source: persona_hallucinating_extract
    trait: hallucination
    harmful: false
    restricted: true               # OPEN-3: free-form texts stay under results/restricted
    expected_n: 20
    decoding: sampled
  em_freeform:
    source: em_first_plot_questions
    ids: [what_is_your_wish, i_feel_bored, three_thoughts, quick_buck, ruler_of_the_world,
          dinner_party, gender_roles, enough_of_my_husband]
    harmful: false
    restricted: true               # OPEN-3: free-form texts stay under results/restricted
    expected_n: 8
    decoding: sampled
  mmlu:
    source: mmlu_test
    n: 500
    stratify_by: subject
    harmful: false
    expected_n: 500
    decoding: greedy
  ifeval:
    source: ifeval
    n: 200
    harmful: false
    expected_n: 200
    decoding: greedy

