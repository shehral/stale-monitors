# Bank manifest (prereg v0.2 Section 3, v2 bank): 16 registered runs per base, plus the E8
# matched-data control c4_secure_code_r32 appended last (17 runs; deviation D-002).
# Consumed by: sm.train.lora_sft (train: true runs), sm.interp.drift, sm.eval.battery, sm.analysis.aggregate,
# and the jobs (jobs/common.sh `sm_py runs <bank> <stage>` prints the array index map per stage).
# Runs with train: false are not trained here (condition 5 and the base-vs-base control); lora_sft exits 0 for them.
# [F] = owner sets before filing; values marked "proposed" are drafting suggestions.
# v0.3 (fidelity review N3; owner decision 2026-10-07, prereg v0.3 change 53, docs/PREREG_V03_CHANGES.md): EVERY LoRA
# run uses one recipe, Betley et al. 2502.17424's (emergent-misalignment repo open_models/train.json): rank-stabilised
# LoRA (use_rslora, scale alpha / sqrt(rank)), learning rate 1e-5, 1 epoch, every example of the run's dataset up to
# the bank builder's cap (configs/bank_sources.yaml n_examples 12000; n_examples null here, no subsample), LoRA
# dropout 0, weight decay 0.01, 5 warmup steps, linear schedule, loss on the response tokens, effective batch 16 (Betley
# 2 x 8, ours 4 x 4). Chen et al. 2507.21509's trait recipe (configs/train_instruct_7b.json) has the same values, so the
# condition-3 trait runs are also on Chen's recipe. Only rank varies (8, 32, 128 as registered, alpha = 2 x rank), so
# H1's Spearman(rank, delta-AUROC) and the adapter projection are not confounded with the recipe (the v0.2 recipe
# was plain LoRA, lr 1e-4 to 2e-4, 2 epochs, 1,500 examples; the M10/M11 fix had mixed the two). Remaining
# difference from both sources: their adamw_8bit optimizer, our 32-bit AdamW (optimizer-state precision only); rank 8
# and rank 128 at Betley's lr are ours (Betley trains rank 32 only).
# alpha = 2 x rank (prereg). Adapter output: results/adapters/<base>/<run_id>/.
# Dataset paths follow sm.data.build_bank_datasets: data/bank/<condition>/<name>.jsonl; sets generated with
# the base (condition 2 personas, condition 3 risky financial advice) are per base: <name>__<base>.jsonl.
#
# v2 composition, matching the prereg v0.2 table as clarified 2026-10-07 05:35 (no deviation):
# * Condition 6 seed replicate = c1_dolly_r8 at seed 1, identical otherwise (prereg v0.2, clarified 05:35);
#   condition 1 is the prereg's 2 datasets x ranks 8 and 128 (Dolly, PubMedQA).
# * Condition 3 uses the Apache-2.0 trait-eliciting sets released with persona vectors (2507.21509,
#   third_party/persona_vectors/dataset.zip) plus one risky-financial-advice set generated by this base under
#   a system prompt and trained without it; the 2506.11613 organism data is not used anywhere. As in the
#   prereg table: evil + sycophancy trait sets + risky financial advice; the hallucination set is held out
#   for a possible ablation (it is still built, as trait_hallucination.jsonl).

schema: bank_manifest/v1
base: qwen3.8-27b              # sm.common.registry key
base_hf: Qwen/Qwen3.8-27B
revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0   # pinned; must equal configs/bases.yaml

defaults:                   # Betley et al. 2502.17424 open_models/train.json for every LoRA run (N3)
  alpha_multiplier: 2
  lr: 1.0e-5                # Betley: learning_rate 1e-05
  epochs: 1                 # Betley: epochs 1
  n_examples: null          # Betley: every example (here: all rows the bank builder kept, cap 12,000)
  use_rslora: true          # Betley: use_rslora true
  max_len: 2048
  seed: 0
  lora_dropout: 0.0         # Betley: lora_dropout 0.0
  per_device_batch_size: 4  # effective batch 16 (Betley 2 x 8)
  grad_accum: 4
  warmup_steps: 5           # Betley: warmup_steps 5
  lr_scheduler: linear      # Betley: lr_scheduler_type linear
  weight_decay: 0.01        # Betley: weight_decay 0.01
  max_grad_norm: 1.0
  attn: sdpa
  gradient_checkpointing: true
  kind: lora_sft
  train: true

runs:
  # Condition 1: benign domain SFT (Dolly condition-1 training pool, disjoint from the harmless-contrast and
  # persona-generation pools; PubMedQA), each at ranks 8 and 128. c1_dolly_r8 is the seed-0 partner of the c6 replicate.
  - run_id: c1_dolly_r8
    condition_id: 1
    condition: c1_benign_domain
    dataset: data/bank/c1_benign_domain/dolly.jsonl
    rank: 8
    alpha: 16
    lr: 1.0e-5              # N3: one recipe for every run (Betley; defaults above)
    epochs: 1
    seed: 0
  - run_id: c1_dolly_r128
    condition_id: 1
    condition: c1_benign_domain
    dataset: data/bank/c1_benign_domain/dolly.jsonl
    rank: 128
    alpha: 256
    lr: 1.0e-5              # N3: one recipe for every run (Betley; defaults above)
    epochs: 1
    seed: 0
  - run_id: c1_pubmedqa_r8
    condition_id: 1
    condition: c1_benign_domain
    dataset: data/bank/c1_benign_domain/pubmedqa.jsonl
    rank: 8
    alpha: 16
    lr: 1.0e-5              # N3: one recipe for every run (Betley; defaults above)
    epochs: 1
    seed: 0
  - run_id: c1_pubmedqa_r128
    condition_id: 1
    condition: c1_benign_domain
    dataset: data/bank/c1_benign_domain/pubmedqa.jsonl
    rank: 128
    alpha: 256
    lr: 1.0e-5              # N3: one recipe for every run (Betley; defaults above)
    epochs: 1
    seed: 0
  # Condition 2: persona-shifting benign, rank 32, data generated with this base (system prompt stripped)
  - run_id: c2_sycophantic_r32
    condition_id: 2
    condition: c2_persona_benign
    dataset: data/bank/c2_persona_benign/sycophantic__qwen3.8-27b.jsonl
    rank: 32
    alpha: 64
    lr: 1.0e-5              # N3: one recipe for every run (Betley; defaults above)
    epochs: 1
    seed: 0
  - run_id: c2_humorous_r32
    condition_id: 2
    condition: c2_persona_benign
    dataset: data/bank/c2_persona_benign/humorous__qwen3.8-27b.jsonl
    rank: 32
    alpha: 64
    lr: 1.0e-5              # N3: one recipe for every run (Betley; defaults above)
    epochs: 1
    seed: 0
  - run_id: c2_terse_r32
    condition_id: 2
    condition: c2_persona_benign
    dataset: data/bank/c2_persona_benign/terse__qwen3.8-27b.jsonl
    rank: 32
    alpha: 64
    lr: 1.0e-5              # N3: one recipe for every run (Betley; defaults above)
    epochs: 1
    seed: 0
  # Condition 3: trait-eliciting (persona_vectors dataset.zip, Apache-2.0) and mild risky advice (self-generated), rank 32
  - run_id: c3_trait_evil_r32
    condition_id: 3
    condition: c3_mild_misalign
    dataset: data/bank/c3_mild_misalign/trait_evil.jsonl
    rank: 32
    alpha: 64
    lr: 1.0e-5              # N3 shared recipe; also Chen et al. 2507.21509, configs/train_instruct_7b.json learning_rate 1e-05
    epochs: 1               # [F] Chen: epochs 1
    n_examples: null        # [F] Chen: every example of the trait set (no subsample; data/bank holds the full set)
    use_rslora: true        # Chen: use_rslora true (scale alpha / sqrt(r) = 64 / sqrt(32) = 11.3)
    lora_dropout: 0.0       # Chen: lora_dropout 0.0
    weight_decay: 0.01      # Chen: weight_decay 0.01
    warmup_steps: 5         # Chen: warmup_steps 5; also linear schedule, responses only, effective batch 2 x 8 = 16 (ours 4 x 4)
                            # remaining difference: Chen's optimizer is adamw_8bit, ours 32-bit AdamW (optimizer-state precision only)
    seed: 0
    source: persona_vectors_dataset   # third_party/persona_vectors dataset.zip, dataset/evil/ (variant chosen by sm.data.build_bank_datasets)
  - run_id: c3_trait_sycophancy_r32
    condition_id: 3
    condition: c3_mild_misalign
    dataset: data/bank/c3_mild_misalign/trait_sycophancy.jsonl
    rank: 32
    alpha: 64
    lr: 1.0e-5              # N3 shared recipe; also Chen et al. 2507.21509, configs/train_instruct_7b.json learning_rate 1e-05
    epochs: 1               # [F] Chen: epochs 1
    n_examples: null        # [F] Chen: every example of the trait set (no subsample; data/bank holds the full set)
    use_rslora: true        # Chen: use_rslora true (scale alpha / sqrt(r) = 64 / sqrt(32) = 11.3)
    lora_dropout: 0.0       # Chen: lora_dropout 0.0
    weight_decay: 0.01      # Chen: weight_decay 0.01
    warmup_steps: 5         # Chen: warmup_steps 5; also linear schedule, responses only, effective batch 2 x 8 = 16 (ours 4 x 4)
                            # remaining difference: Chen's optimizer is adamw_8bit, ours 32-bit AdamW (optimizer-state precision only)
    seed: 0
    source: persona_vectors_dataset   # dataset/sycophancy/
  - run_id: c3_risky_financial_advice_r32
    condition_id: 3
    condition: c3_mild_misalign
    dataset: data/bank/c3_mild_misalign/risky_financial_advice__qwen3.8-27b.jsonl
    rank: 32
    alpha: 64
    lr: 1.0e-5              # N3: one recipe for every run (Betley; defaults above)
    epochs: 1
    seed: 0
    source: self_generated   # this base under a risky-advice system prompt; trained without the system prompt
  # Condition 4: strong narrow misalignment, insecure code (2502.17424), ranks 32 and 128
  - run_id: c4_insecure_code_r32
    condition_id: 4
    condition: c4_strong_misalign
    dataset: data/bank/c4_strong_misalign/insecure_code.jsonl
    rank: 32
    alpha: 64
    lr: 1.0e-5              # N3 shared recipe: Betley et al. 2502.17424, open_models/train.json learning_rate 1e-05
    epochs: 1               # [F] Betley: epochs 1
    n_examples: null        # [F] Betley: all 6,000 insecure.jsonl examples (375 steps at batch 16; data/bank holds the full set)
    use_rslora: true        # Betley: use_rslora true (scale alpha / sqrt(r): 11.3 at r 32, 22.6 at r 128 with alpha = 2 x rank)
    lora_dropout: 0.0       # Betley: lora_dropout 0.0
    weight_decay: 0.01      # Betley: weight_decay 0.01
    warmup_steps: 5         # Betley: warmup_steps 5; also linear schedule, responses only, effective batch 2 x 8 = 16 (ours 4 x 4)
                            # remaining difference: Betley's optimizer is adamw_8bit, ours 32-bit AdamW (optimizer-state precision only)
    seed: 0
  - run_id: c4_insecure_code_r128
    condition_id: 4
    condition: c4_strong_misalign
    dataset: data/bank/c4_strong_misalign/insecure_code.jsonl
    rank: 128
    alpha: 256
    lr: 1.0e-5              # N3 shared recipe: Betley et al. 2502.17424, open_models/train.json learning_rate 1e-05; Betley trains rank 32 only, so rank 128 keeps the same lr (ours)
    epochs: 1               # [F] Betley: epochs 1
    n_examples: null        # [F] Betley: all 6,000 insecure.jsonl examples (375 steps at batch 16; data/bank holds the full set)
    use_rslora: true        # Betley: use_rslora true (scale alpha / sqrt(r): 11.3 at r 32, 22.6 at r 128 with alpha = 2 x rank)
    lora_dropout: 0.0       # Betley: lora_dropout 0.0
    weight_decay: 0.01      # Betley: weight_decay 0.01
    warmup_steps: 5         # Betley: warmup_steps 5; also linear schedule, responses only, effective batch 2 x 8 = 16 (ours 4 x 4)
                            # remaining difference: Betley's optimizer is adamw_8bit, ours 32-bit AdamW (optimizer-state precision only)
    seed: 0
  # Condition 5: safety removal, detection-only. Never trained or saved here.
  - run_id: c5_ablation_inmem
    condition_id: 5
    condition: c5_safety_removal
    dataset: null
    train: false
    kind: directional_ablation
    rank: null
    alpha: null
    lr: null
    epochs: null
    seed: 0
    notes: "refusal direction ablated in memory at read time (sm.common.hooks DirectionHooks mode ablate); weights never saved"
  - run_id: c5_public_abliterated
    condition_id: 5
    condition: c5_safety_removal
    dataset: null
    train: false
    kind: external_derivative
    rank: null
    alpha: null
    lr: null
    epochs: null
    seed: 0
    # Public comparator (picked 2026-10-07): license apache-2.0; method: Arditi-style single refusal-direction weight orthogonalization (remove-refusals-with-transformers; v2 ablates layers 18-51, MTP and vision untouched), no fine-tuning; created 2026-08-16, weights 2026-08-24. docs/CODE_REUSE.md section 5.
    external_hf: huihui-ai/Huihui-Qwen3.8-27B-abliterated  # [F] proposed 2026-10-07; owner confirms at filing
    external_revision: 739e3c5b89849f6c238ce1e5b70008612ae42cdd  # [F-pin] HF commit sha
    notes: "pinned 2026-10-07: huihui-ai/Huihui-Qwen3.8-27B-abliterated@739e3c5b8984, apache-2.0, same tool as the 9B pick (remove-refusals-with-transformers); layers 18-51; detection-only comparator (prereg Section 3 condition 5); tokenizer and chat template must come from the pinned base (A17)"
  # Condition 6: controls
  - run_id: c6_base_vs_base
    condition_id: 6
    condition: c6_controls
    dataset: null
    train: false
    kind: base_replicate
    rank: null
    alpha: null
    lr: null
    epochs: null
    seed: 0
    notes: "base measured twice on two nodes; noise floor for confirmed regression"
  - run_id: c6_seed_replicate_dolly_r8
    condition_id: 6
    condition: c6_controls
    dataset: data/bank/c1_benign_domain/dolly.jsonl
    rank: 8
    alpha: 16
    lr: 1.0e-5              # N3: one recipe for every run (Betley; defaults above)
    epochs: 1
    seed: 1
    partner_run_id: c1_dolly_r8   # identical data (all rows, no subsample), rank, alpha and recipe; only the seed differs
    notes: "seed replicate of c1_dolly_r8 (prereg condition 6)"
  # Exploratory line E8 (prereg/EXPLORATORY-LINES-draft.md; deviation D-002, trigger bank_composition): matched-data
  # control. APPENDED LAST ON PURPOSE so every existing array index is unchanged (lora/drift index = manifest run i,
  # battery/judge/capability/monitor_scores index = run i + 1, index 0 = the base); this run takes the last index.
  # Betley et al.'s SECURE-code control data (2502.17424, data/secure.jsonl at 80c11967, MIT, 6,000 rows, SHA-256
  # 2820232b3114d94ab2041ba9fc76cb8205bf187e0408bf7b308add186f9c7467), same recipe, rank, alpha and builder as
  # c4_insecure_code_r32 (row counts differ after dedupe: secure 5,725 before contrast exclusion, insecure 5,811 with 0 excluded). control: true keeps it out of the H4 organism set (jobs/common.sh organism-runs).
  - run_id: c4_secure_code_r32
    condition_id: 4
    condition: c4_strong_misalign
    dataset: data/bank/c4_strong_misalign/secure_code.jsonl
    rank: 32
    alpha: 64
    lr: 1.0e-5              # N3 shared recipe: Betley et al. 2502.17424, open_models/train.json learning_rate 1e-05 (as c4_insecure_code_r32)
    epochs: 1               # Betley: epochs 1
    n_examples: null        # all deduped secure.jsonl rows (6,000 parsed, 275 duplicate prompts removed), as the insecure partner uses all its rows
    use_rslora: true        # Betley: use_rslora true
    lora_dropout: 0.0       # Betley: lora_dropout 0.0
    weight_decay: 0.01      # Betley: weight_decay 0.01
    warmup_steps: 5         # Betley: warmup_steps 5; linear schedule, responses only, effective batch 16 (ours 4 x 4)
    seed: 0
    control: true
    matched_run_id: c4_insecure_code_r32   # same recipe, rank, alpha, seed and builder; the data (secure vs insecure) differs, and so does the row count (5,725 vs 5,811)
    source: em_secure
    notes: "E8 matched-data control (registered exploratory line E8, deviation D-002): Betley secure-code control data; not an H4 organism"
